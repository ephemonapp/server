name: PR Checks
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test Ephemon.sln --no-build --configuration Release --verbosity normal

  installer:
    # deployment/install.sh is served verbatim at https://get.ephemon.app,
    # so a broken commit on main is a broken installer for everyone.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Syntax check
        run: bash -n deployment/install.sh
      - name: ShellCheck
        run: shellcheck deployment/install.sh
