name: Release multi-arch Docker image

permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  build_amd64:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push AMD64 image
        run: |
          docker build -f ./src/Ephemon/Dockerfile -t ephemon/server:amd64 .
          docker push ephemon/server:amd64

  build_arm64:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push ARM64 image
        run: |
          docker build -f ./src/Ephemon/Dockerfile -t ephemon/server:arm64 .
          docker push ephemon/server:arm64

  create_manifest:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    needs: [build_amd64, build_arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ephemon/server:latest \
            ephemon/server:arm64 \
            ephemon/server:amd64
